# Lokaler Start mit einem Befehl: docker compose up --build
# Konfiguration nur über Umgebungsvariablen; .env ist optional (siehe .env.example).
services:
  app:
    build: .
    image: serviceanfragen-assistent:local
    ports:
      - "8040:8040"
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
