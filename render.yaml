# Render Blueprint. Vorbereitet, nicht ausgerollt.
# Free-Plan (Stand 11.09.2026, render.com/docs/free): Instanz schläft nach 15 Minuten
# ohne Anfragen ein, der erste Aufruf danach dauert bis zu einer Minute; 750 Instanz-
# stunden je Monat; Dateisystem flüchtig (Statusänderungen gehen beim Neustart verloren).
# Die Mock-Systemlandschaft läuft hier absichtlich im selben Prozess wie die App
# (SYSTEME_BASE_URL bleibt ungesetzt, siehe app/integration/__init__.py): ein
# zweiter Dienst nur für ERP/CRM/MES-Mocks würde den Fußabdruck verdoppeln
# (zweite Instanz, zweiter Kaltstart, zweites 750-Stunden-Kontingent) und bringt
# für Attrappen ohne echte Last keinen Nutzen. Das Sidecar-Muster aus
# infra/azure/main.tf lohnt sich erst, wenn ein echter zweiter Prozess nötig ist.
services:
  - type: web
    name: kundenanfragen-assistent
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/status
    autoDeploy: false
    envVars:
      # Live-Pfad bleibt aus: sonst zahlt der Schlüssel für jeden Besucher.
      - key: LIVE_MODELLAUFRUFE
        value: "0"
      # Nur im Render-Dashboard setzen, nie in dieser Datei. Ohne Live-Pfad ungenutzt.
      - key: LLM_API_KEY
        sync: false
